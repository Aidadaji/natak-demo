name: Android test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk natak-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android test build
          body: Debug build for testing on your own phone. Not for the Play Store.
          prerelease: true
          files: mobile/natak-test.apk
