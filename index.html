<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natak Short Dramas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-sized stage. Home shelf, full-bleed vertical player, bottom sheets for the paywall. Single dark theme by choice: it is a video app. */
:root{
  color-scheme: dark;
  --night:#1b1026;      /* page and app background, plum-black */
  --velvet:#2a1a3a;     /* raised surfaces */
  --line:#4a3560;       /* borders */
  --paper:#f6ecdf;      /* main text */
  --dust:#b9a6c4;       /* secondary text */
  --marigold:#f5a524;   /* accent, calls to action */
  --sindoor:#d8344a;    /* locks, alerts */
  --leaf:#3fbf8a;       /* success */
  --display:"Rozha One", Georgia, serif;
  --body:"Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#120a1a;color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.4;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.app{position:relative;width:100%;max-width:430px;height:100%;background:var(--night);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:480px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* demo ribbon */
.ribbon{flex:none;background:var(--velvet);border-bottom:1px solid var(--line);padding:6px 16px;font-size:12.5px;color:var(--dust);display:flex;gap:8px;justify-content:space-between;align-items:center}
.ribbon button{color:var(--marigold);font-weight:600;font-size:12.5px;padding:4px 0}

.view{flex:1;min-height:0;overflow-y:auto;display:none}
.view.on{display:block}

/* HOME */
.top{padding:18px 16px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--display);font-size:30px;line-height:1;color:var(--marigold);letter-spacing:.5px}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--dust);letter-spacing:0;margin-top:4px}
.pill{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--dust);white-space:nowrap}
.pill.vip{color:#1b1026;background:var(--marigold);border-color:var(--marigold)}
.hero{margin:12px 16px 4px;border-radius:14px;overflow:hidden;position:relative;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;text-align:left;width:calc(100% - 32px)}
.hero h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;margin:0 0 6px;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero p{margin:0 0 12px;font-size:14px;color:#f3e6d8;max-width:30ch;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--marigold);color:#1b1026;font-weight:700;border-radius:999px;padding:9px 16px;font-size:15px;align-self:flex-start}
.shelf h3{font-size:15px;font-weight:700;margin:20px 16px 10px;letter-spacing:.2px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:128px;text-align:left;scroll-snap-align:start}
.poster{height:182px;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px}
.poster b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.05;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.tag{position:absolute;top:8px;left:8px;background:rgba(18,10,26,.75);font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.card span{display:block;font-size:12.5px;color:var(--dust);margin-top:6px}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.28),transparent 45%),linear-gradient(to top,rgba(18,10,26,.85),transparent 60%);pointer-events:none}
.hero>*:not(.glow),.poster>*:not(.glow){position:relative}
.poster>.tag{position:absolute}
.foot{padding:22px 16px 28px;color:var(--dust);font-size:12.5px}

/* PLAYER */
#player{position:relative;overflow:hidden}
#player.on{display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.scene{position:absolute;inset:-12%;animation:drift 14s ease-in-out infinite alternate}
.scene i{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;animation:float 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-3%,2%)}}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(12%,-10%)}}
.paused .scene,.paused .scene i{animation-play-state:paused}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,10,26,.7),transparent 22%,transparent 50%,rgba(18,10,26,.88))}
.ptop{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:50%;background:rgba(18,10,26,.6);font-size:20px;line-height:1}
.ptitle{font-weight:700;font-size:15px;flex:1;min-width:0}
.ptitle small{display:block;font-weight:500;color:var(--dust);font-size:12.5px}
.placeholder{position:absolute;top:64px;left:14px;font-size:11.5px;color:var(--dust);background:rgba(18,10,26,.6);padding:3px 8px;border-radius:6px}
.cap{position:absolute;left:18px;right:70px;bottom:120px;font-size:21px;font-weight:700;line-height:1.25;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.cap em{font-style:normal;color:var(--marigold)}
.namecard{position:absolute;left:18px;bottom:210px;border-left:3px solid var(--marigold);padding:2px 0 2px 10px;font-size:13px;color:var(--paper)}
.namecard b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.side{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:14px;align-items:center}
.side button{width:46px;height:46px;border-radius:50%;background:rgba(18,10,26,.6);font-size:12px;font-weight:700}
.tap{position:absolute;inset:60px 60px 110px 0}
.bigplay{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(18,10,26,.65);font-size:28px;display:none;align-items:center;justify-content:center;pointer-events:none}
.paused .bigplay{display:flex}
.pbot{position:absolute;left:0;right:0;bottom:0;padding:0 14px 14px}
.bar{height:4px;background:rgba(246,236,223,.25);border-radius:4px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--marigold)}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.ctl button{background:rgba(18,10,26,.6);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.ctl .next{background:var(--marigold);color:#1b1026;border-color:var(--marigold)}
.auto{font-size:13px;color:var(--dust);display:flex;align-items:center;gap:6px}
.auto input{accent-color:var(--marigold);width:16px;height:16px}

/* SHEETS */
.scrim{position:absolute;inset:0;background:rgba(10,5,15,.72);display:none;align-items:flex-end;z-index:5}
.scrim.on{display:flex}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--velvet);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px 20px}
.sheet h4{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
.sheet .sub{color:var(--dust);font-size:14px;margin:0 0 14px}
.opt{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;background:rgba(27,16,38,.6)}
.opt.best{border-color:var(--marigold);background:rgba(245,165,36,.1)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:15.5px}
.opt .t span{font-size:13px;color:var(--dust)}
.opt .p{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt .p.free{color:var(--leaf)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.close{display:block;margin:6px auto 0;color:var(--dust);font-size:14px;padding:8px 14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.grid button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.grid button.free{background:rgba(63,191,138,.14);border-color:rgba(63,191,138,.5)}
.grid button.open{background:rgba(245,165,36,.14);border-color:rgba(245,165,36,.55)}
.grid button.lock{color:var(--dust)}
.grid button.lock::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--sindoor)}
.grid button.now{outline:2px solid var(--paper);outline-offset:1px}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dust)}
.key i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.pay{border:1px dashed var(--line);border-radius:12px;padding:14px;margin:6px 0 12px;font-size:14px}
.pay .amt{font-family:var(--display);font-size:34px;line-height:1;margin:4px 0 8px}
.wide{width:100%;background:var(--marigold);color:#1b1026;font-weight:700;border-radius:999px;padding:12px;font-size:16px}
.note{font-size:12.5px;color:var(--dust);margin:10px 0 0}
.adbox{height:150px;border-radius:12px;background:repeating-linear-gradient(45deg,#33214a,#33214a 12px,#2a1a3a 12px,#2a1a3a 24px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;margin-bottom:12px}
.adbox b{font-family:var(--display);font-weight:400;font-size:40px}
.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:var(--leaf);color:#0d231a;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;z-index:9;display:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{display:block}
.me dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px}
.me dt{color:var(--dust)}
.me dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

video#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
.hasvid video#vid{display:block}
.hasvid .scene,.hasvid .placeholder,.hasvid .cap,.hasvid .namecard{display:none !important}
.side button b{display:block;font-size:10px;font-weight:600;color:var(--dust)}
.side button.on{background:var(--marigold);color:#1b1026}
.side button.on b{color:#1b1026}
.stats{font-size:12.5px;color:var(--dust);margin-top:3px;font-variant-numeric:tabular-nums}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:13px;color:var(--dust);margin-bottom:4px}
.field input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--night);color:var(--paper);font:inherit}
.formerr{color:#ff9aa8;font-size:14px;min-height:20px;margin:4px 0}
.linkbtn{color:var(--marigold);font-weight:600;font-size:14px;padding:8px 0}
.wide.alt{background:none;border:1px solid var(--line);color:var(--paper);margin-top:8px;display:block;text-align:center;text-decoration:none}
.toast.err{background:var(--sindoor);color:#fff}
.copybox{width:100%;padding:10px;border-radius:10px;border:1px dashed var(--line);background:var(--night);color:var(--paper);font:13px/1.3 ui-monospace,monospace;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){.scene,.scene i{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="ribbon"><span>Test build. Payments and ads are in test mode.</span><span id="who"></span></div>
  <div class="toast" id="toast" role="status"></div>

  <main class="view on" id="home">
    <div class="top">
      <div class="brand">NATAK<small>Placeholder name. Your brand goes here.</small></div>
      <button class="pill" id="acctBtn" type="button">Account</button>
    </div>
    <button class="hero" id="hero" type="button"></button>
    <section class="shelf" id="contSec" hidden><h3>Continue watching</h3><div class="row" id="rowCont"></div></section>
    <section class="shelf" id="listSec" hidden><h3>My list</h3><div class="row" id="rowList"></div></section>
    <section class="shelf"><h3>All shows</h3><div class="row" id="rowAll"></div></section>
    <section class="shelf"><h3>Hidden identity</h3><div class="row" id="rowHidden"></div></section>
    <section class="shelf"><h3>Revenge and comeback</h3><div class="row" id="rowRevenge"></div></section>
    <p class="foot" id="foot"></p>
  </main>

  <section class="view" id="player">
    <div class="stage" id="stage">
      <div class="scene" id="scene"></div>
      <video id="vid" playsinline preload="metadata"></video>
      <div class="shade"></div>
      <div class="tap" id="tap" role="button" tabindex="0" aria-label="Pause or play"></div>
      <div class="bigplay" aria-hidden="true">&#9654;</div>
      <div class="ptop">
        <button class="back" id="backBtn" type="button" aria-label="Back to home">&#8249;</button>
        <div class="ptitle"><span id="pShow"></span><small id="pEp"></small></div>
      </div>
      <div class="placeholder">No video uploaded for this episode yet. Sample picture, 12 s.</div>
      <div class="namecard" id="namecard"></div>
      <div class="cap" id="cap"></div>
      <div class="side">
        <button id="likeBtn" type="button" aria-label="Like this show">Like<b id="likeN">0</b></button>
        <button id="saveBtn" type="button" aria-label="Add to my list">List<b id="saveN">0</b></button>
        <button id="listBtn" type="button" aria-label="All episodes">EP</button>
        <button id="shareBtn" type="button" aria-label="Share this show">Share</button>
      </div>
      <div class="pbot">
        <div class="bar"><div id="prog"></div></div>
        <div class="ctl">
          <label class="auto" for="autoplay"><input type="checkbox" id="autoplay" checked> Autoplay next</label>
          <button class="next" id="nextBtn" type="button">Next episode &#8250;</button>
        </div>
      </div>
    </div>
  </section>

  <div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script src="app.js"></script>
</body>
</html>
